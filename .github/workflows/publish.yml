# Publication de n8n-nodes-outsend sur npm.
#
# n8n EXIGE, pour tout node soumis a la verification depuis le 1er mai 2026,
# que le paquet soit publie depuis une GitHub Action AVEC une declaration de
# provenance. Une publication faite depuis une machine locale est refusee.
#
# Authentification par npm Trusted Publishers (OIDC) : npmjs.com fait
# confiance a CE workflow (outsend-xyz/n8n-nodes-outsend, publish.yml).
# Aucun jeton npm n'est stocke sur GitHub. `id-token: write` autorise a la
# fois l'echange OIDC et la signature de la provenance, et il faut npm >= 11.5.1
# (Node 22 embarque npm 10, d'ou la mise a jour avant la publication).

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # Les memes controles que ceux exiges par la verification n8n :
      # un paquet qui ne lint pas ne doit jamais atteindre le registre.
      - name: Lint (n8n community node rules)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upgrade npm (Trusted Publishers needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Publish with provenance
        run: npm publish --provenance --access public
